<!-- fetches 'theme' from localStorage and loads <link  id="active-theme-link" rel="stylesheet" href="$theme"> -->

<!-- NOTE: prevent theme flash because we only declare a stylesheet once, despite fetching them both in head -->
<!-- NOTE: inline script to block rendering of body -->
<script>
  // immediately evaluated function expression for lexically scoped vars:
  (function() {
      var theme = localStorage.getItem('theme');
      var prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
      var activeHref = (theme === 'light' || (!theme && prefersLight))
          ? '{{ .light.Permalink }}'
          : '{{ .dark.Permalink }}';
      // document.write blocks the HTML parser until the CSS is applied, preventing FOUC.
      document.write('<link id="active-theme-link" rel="stylesheet" href="' + activeHref + '">');
  })();
</script>
